<html><body style="font: -apple-system-body; margin: 0">
<h2>Version 1.22.20</h2>
<ul>
  <li>打开驱动器时会显示正在进行的操作和大约剩余的时间。</li>
  <li>更新后首次打开时，不再等待 Linux 环境准备完成。</li>
  <li>每个 Lukotta 应用都能找到已存储的密码，不会再次询问。</li>
  <li>每个 Lukotta 应用都会记住它打开过的每个驱动器。</li>
  <li>Finder 以驱动器自己的名称显示每个驱动器，删除文件夹会删除其中的所有文件。</li>
  <li>另一份已安装的 Lukotta 不会再关闭驱动器。</li>
  <li>在 Finder 中推出的驱动器在 Lukotta 中也会关闭。</li>
  <li>退出时会显示正在推出的驱动器，并且不再卡住。</li>
</ul>
</body></html>
