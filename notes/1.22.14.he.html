<h2>Version 1.22.14</h2>
<ul>
  <li>כל כונן ברשימה מציין מה יש עליו, גם כונן בלי טבלת מחיצות.</li>
  <li>תמונת דיסק נקראת על שם הקובץ שלה, ולא ״תמונת דיסק״ פעמיים.</li>
  <li>הרשימה מופיעה מיד, לא משנה כמה כוננים מחוברים.</li>
</ul>
