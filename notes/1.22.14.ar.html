<h2>Version 1.22.14</h2>
<ul>
  <li>كل قرص في القائمة يذكر ما يحتويه، حتى القرص الذي بلا جدول تقسيم.</li>
  <li>تُسمّى صورة القرص باسم ملفها، بدل تكرار عبارة «صورة قرص» مرتين.</li>
  <li>تظهر القائمة سريعًا مهما كان عدد الأقراص الموصولة.</li>
</ul>
